<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <span class="arrow left" onclick="event.stopPropagation(); showPrev()">❮</span>
    <img id="lightbox-img" alt="Expanded artwork">
    <span class="arrow right" onclick="event.stopPropagation(); showNext()">❯</span>
</div>

<!-- Loading indicator inside gallery -->
<div id="sentinel" class="sentinel">
    <span class="loading-text">Loading </span>
</div>
<footer id="footer">
    © 2026
</footer>
<script>
// LIGHTBOX
let currentLightboxIndex = 0;

function openLightbox(src) {
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lightbox.style.display = "flex";

    const match = src.match(/(\d+)\.(jpg|webp)$/);
    if (match) currentLightboxIndex = parseInt(match[1]);
}

document.getElementById("lightbox-img").onclick = (e) => e.stopPropagation();

function showNext() {
    const nextSrc = `images/${currentLightboxIndex + 1}.webp`;

    const testImg = new Image();
    testImg.src = nextSrc;

    testImg.onload = () => {
        currentLightboxIndex++;
        document.getElementById("lightbox-img").src = nextSrc;
    };

    testImg.onerror = () => {
        // stop at last image
    };
}

function showPrev() {
    if (currentLightboxIndex > 1) {
        currentLightboxIndex--;
        document.getElementById("lightbox-img").src =
            `images/${currentLightboxIndex}.webp`;
    }
}

document.addEventListener("keydown", (e) => {
    const lightbox = document.getElementById("lightbox");
    if (lightbox.style.display === "flex") {
        if (e.key === "ArrowRight") showNext();
        if (e.key === "ArrowLeft") showPrev();
        if (e.key === "Escape") closeLightbox();
    }
});

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}


// GALLERY
const gallery = document.getElementById("gallery");
const sentinel = document.getElementById("sentinel");

const batchSize = 6;
let currentIndex = 1;
let isLoading = false;
let reachedEnd = false;


// MASONRY ENGINE (column width increased by ~50%)
const columnWidth = 480; // was 320 → 480
const gap = 12;

let columns = 0;
let columnHeights = [];

function setupMasonry() {
    const galleryWidth = gallery.clientWidth;

    columns = Math.floor(galleryWidth / (columnWidth + gap));
    if (columns < 1) columns = 1;

    columnHeights = new Array(columns).fill(0);
}

function placeImage(img) {
    const height = img.offsetHeight;
    if (!height) return;

    let minCol = 0;
    for (let i = 1; i < columns; i++) {
        if (columnHeights[i] < columnHeights[minCol]) {
            minCol = i;
        }
    }

    const totalWidth = columns * columnWidth + (columns - 1) * gap;
    const offset = (gallery.clientWidth - totalWidth) / 2;

    const x = offset + minCol * (columnWidth + gap);
    const y = columnHeights[minCol];

    img.style.left = x + "px";
    img.style.top = y + "px";

    columnHeights[minCol] += height + gap;

    gallery.style.height = Math.max(...columnHeights) + 200 + "px";
}


// LOAD IMAGES
function loadBatch() {
    if (isLoading || reachedEnd) return;
    isLoading = true;

    const batch = [];
    let loadedCount = 0;
    let attempted = 0;

    for (let i = 0; i < batchSize; i++) {
        const index = currentIndex;
        const src = `images/${index}.webp`;

        const img = new Image();
        img.src = src;

        attempted++;

        img.onload = () => {
            batch.push({ index, img });
            loadedCount++;
            checkDone();
        };

        img.onerror = () => {
            if (index === 1) {
                reachedEnd = true;
            }
            attempted--;
            checkDone();
        };

        currentIndex++;
    }

    function checkDone() {
        if (loadedCount === attempted || reachedEnd) {
            renderBatch();
        }
    }

    function renderBatch() {
        batch.sort((a, b) => a.index - b.index);

        batch.forEach(obj => {
            const img = obj.img;

            img.alt = `Illustration ${obj.index}`;
            img.loading = "lazy";
            img.onclick = () => openLightbox(img.src);
            img.style.width = columnWidth + "px";
            img.style.position = "absolute";

            gallery.appendChild(img);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    placeImage(img);
                    img.classList.add("loaded");
                });
            });
        });

        if (batch.length === 0) {
    reachedEnd = true;

    // stop observing
    observer.disconnect();

    // hide loading text
    sentinel.style.display = "none";

    // show footer
    document.getElementById("footer").style.display = "block";
}

        isLoading = false;
    }
}


// INIT
window.addEventListener("load", () => {
    setupMasonry();
    loadBatch();

    observer.observe(sentinel);
});


// SCROLL LOAD (detected higher up, on PC too)
const observer = new IntersectionObserver(
    (entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !isLoading && !reachedEnd) {
                loadBatch();
            }
        });
    },
    {
        rootMargin: "500px 0px" // trigger much earlier, especially on wide screens
    }
);

    window.addEventListener("scroll", () => {
    if (isLoading || reachedEnd) return;

    const scrollBottom =
        window.innerHeight + window.scrollY;

    const pageHeight =
        document.documentElement.offsetHeight;

    // trigger earlier on large screens
    if (scrollBottom > pageHeight - 1500) {
        loadBatch();
    }
});

// RESIZE
window.addEventListener("resize", () => {
    setupMasonry();

    const images = gallery.querySelectorAll("img");

    columnHeights.fill(0);

    images.forEach(img => {
        placeImage(img);
    });
});
</script>

</body>
</html>
