<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="sub-header">
        <a href="index.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>

    <nav>
        <a href="index.html">Illustrations</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<!-- Sentinel for infinite scroll -->
<div id="sentinel"></div>

<script>
// LIGHTBOX
function openLightbox(src) {
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");
    img.src = src;
    lightbox.style.display = "flex";
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

<script>
// GALLERY LOADING
const gallery = document.getElementById("gallery");
const sentinel = document.getElementById("sentinel");

const batchSize = 15;
const maxImages = 200;

let currentIndex = 1;
let isLoading = false;

// LOAD IMAGES IN ORDER (SYNCED APPEND)
function loadBatch() {
    if (isLoading) return;
    isLoading = true;

    const fragment = document.createDocumentFragment();
    let loadedCount = 0;

    function loadNext() {
        if (loadedCount >= batchSize || currentIndex > maxImages) {
            gallery.appendChild(fragment);
            isLoading = false;
            return;
        }

        const img = document.createElement("img");
        img.loading = "lazy";
        img.src = `images/${currentIndex}.jpg`;

        const thisIndex = currentIndex;
        currentIndex++;

        img.onload = () => {
            img.onclick = () => openLightbox(img.src);
            img.classList.add("loaded");
            fragment.appendChild(img);
            loadedCount++;
            loadNext(); // load next ONLY after this one finishes → keeps order
        };

        img.onerror = () => {
            loadNext(); // skip missing but keep sequence
        };
    }

    loadNext();
}

// INITIAL LOAD
loadBatch();

// INTERSECTION OBSERVER (better than scroll)
const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
        loadBatch();
    }
}, {
    rootMargin: "200px"
});

observer.observe(sentinel);
</script>

</body>
</html>
