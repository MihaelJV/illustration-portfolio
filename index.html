<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="sub-header">
        <a href="index.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>

    <nav>
        <a href="index.html">Illustrations</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<!-- Sentinel for infinite scroll -->
<div id="sentinel"></div>

<script>
// LIGHTBOX
function openLightbox(src) {
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");
    img.src = src;
    lightbox.style.display = "flex";
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

// GALLERY
const gallery = document.getElementById("gallery");
const sentinel = document.getElementById("sentinel");

const batchSize = 15;
const maxImages = 200;

let currentIndex = 1;
let isLoading = false;

// loading indicator
const loader = document.createElement("div");
loader.innerText = "Loading...";
loader.style.textAlign = "center";
loader.style.padding = "20px";
loader.style.fontSize = "1.2rem";

function loadBatch() {
    if (isLoading) return;
    isLoading = true;

    gallery.appendChild(loader);

    const images = [];
    let loadedCount = 0;
    let targetCount = 0;

    for (let i = 0; i < batchSize && currentIndex <= maxImages; i++) {
        const src = `images/${currentIndex}.jpg`;
        const img = new Image();

        targetCount++;

        img.src = src;

        img.onload = () => {
            loadedCount++;
            images.push({ index: currentIndex, element: img });

            if (loadedCount === targetCount) {
                renderBatch(images);
            }
        };

        img.onerror = () => {
            targetCount--;
            if (loadedCount === targetCount) {
                renderBatch(images);
            }
        };

        currentIndex++;
    }

    function renderBatch(images) {
        loader.remove();

        // SORT to guarantee order
        images.sort((a, b) => a.index - b.index);

        const fragment = document.createDocumentFragment();

        images.forEach(obj => {
            const img = obj.element;

            img.loading = "lazy";
            img.onclick = () => openLightbox(img.src);
            img.classList.add("loaded");

            fragment.appendChild(img);
        });

        gallery.appendChild(fragment);
        isLoading = false;
    }
}

// initial load
loadBatch();

// observer
const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
        loadBatch();
    }
}, {
    rootMargin: "200px"
});

observer.observe(sentinel);
</script>

</body>
</html>
