<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="sub-header">
        <a href="index.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>

    <nav>
        <a href="index.html">Illustrations</a>
        <span class="nav-sep">★</span>
        <a href="books.html">Books</a>
        <span class="nav-sep">★</span>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <span class="arrow left" onclick="event.stopPropagation(); showPrev()">❮</span>
    <img id="lightbox-img" alt="Expanded artwork">
    <span class="arrow right" onclick="event.stopPropagation(); showNext()">❯</span>
</div>
    
<!-- Sentinel -->
<div id="sentinel"></div>

<script>
// LIGHTBOX
let currentLightboxIndex = 0;
function openLightbox(src) {
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lightbox.style.display = "flex";

    // extract index from filename
    const match = src.match(/(\d+)\.jpg$/);
    if (match) {
        currentLightboxIndex = parseInt(match[1]);
    }
}

// Prevent closing when clicking image
document.getElementById("lightbox-img").onclick = (e) => {
    e.stopPropagation();
};

function showNext() {
    if (currentLightboxIndex < maxImages) {
        currentLightboxIndex++;
        document.getElementById("lightbox-img").src = `images/${currentLightboxIndex}.jpg`;
    }
}

function showPrev() {
    if (currentLightboxIndex > 1) {
        currentLightboxIndex--;
        document.getElementById("lightbox-img").src = `images/${currentLightboxIndex}.jpg`;
    }
}
    
document.addEventListener("keydown", (e) => {
    const lightbox = document.getElementById("lightbox");

    if (lightbox.style.display === "flex") {
        if (e.key === "ArrowRight") showNext();
        if (e.key === "ArrowLeft") showPrev();
        if (e.key === "Escape") closeLightbox();
    }
});

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

// GALLERY
const gallery = document.getElementById("gallery");
const sentinel = document.getElementById("sentinel");

const batchSize = 6;
const maxImages = 200;

let currentIndex = 1;
let isLoading = false;

function loadBatch() {
    if (isLoading || currentIndex > maxImages) return;
    isLoading = true;

    let remainingInBatch = batchSize;

    for (let i = 0; i < batchSize && currentIndex <= maxImages; i++) {
        const index = currentIndex;
        const src = `images/${index}.jpg`;

        const img = document.createElement("img");
        img.src = src;
        img.alt = `Illustration ${index}`;
        img.onclick = () => openLightbox(src);

        // Append immediately for masonry layout
        gallery.appendChild(img);

        img.onload = () => {
            img.classList.add("loaded");
            remainingInBatch--;
            if (remainingInBatch === 0) {
                isLoading = false;
            }
        };

        img.onerror = () => {
            img.remove();  // Remove broken images
            remainingInBatch--;
            if (remainingInBatch === 0) {
                isLoading = false;
            }
        };

        currentIndex++;
    }
}

// Initial load
loadBatch();

// INTERSECTION OBSERVER
const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !isLoading) {
        loadBatch();
    }
}, {
    rootMargin: "300px"
});

observer.observe(sentinel);
</script>

</body>
</html>
