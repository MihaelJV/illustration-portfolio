<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="sub-header">
        <a href="index.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>

    <nav>
        <a href="index.html">Illustrations</a>
        <span class="nav-sep">★</span>
        <a href="books.html">Books</a>
        <span class="nav-sep">★</span>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" alt="Expanded artwork">
</div>

<!-- Sentinel -->
<div id="sentinel"></div>

<script>
// LIGHTBOX
function openLightbox(src) {
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lightbox.style.display = "flex";
}

// Prevent closing when clicking image
document.getElementById("lightbox-img").onclick = (e) => {
    e.stopPropagation();
};

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

// GALLERY
const gallery = document.getElementById("gallery");
const sentinel = document.getElementById("sentinel");

const batchSize = 6;   // 🔥 smaller = faster on mobile
const maxImages = 200;

let currentIndex = 1;
let isLoading = false;

function loadBatch() {
    if (isLoading) return;
    isLoading = true;

    let loadedInBatch = 0;

    for (let i = 0; i < batchSize && currentIndex <= maxImages; i++) {
        const index = currentIndex;
        const src = `images/${index}.jpg`;

        const img = document.createElement("img");
        img.src = src;
        img.alt = `Illustration ${index}`;

        img.onclick = () => openLightbox(src);

        gallery.appendChild(img); // append immediately

        img.onload = () => {
            img.classList.add("loaded");
        };

            loadedInBatch++;
            if (loadedInBatch === batchSize) {
                isLoading = false;
            }
        };

        img.onerror = () => {
            img.remove();
            loadedInBatch++;
            if (loadedInBatch === batchSize) {
                isLoading = false;
            }
        };

        currentIndex++;
    }
}

// initial load
loadBatch();

// INTERSECTION OBSERVER (smooth infinite scroll)
const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
        loadBatch();
    }
}, {
    rootMargin: "300px"
});

observer.observe(sentinel);
</script>

</body>
</html>
