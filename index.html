<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="sub-header">
        <a href="index.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>

    <nav>
        <a href="index.html">Illustrations</a>
        <span class="nav-sep">★</span>
        <a href="books.html">Books</a>
        <span class="nav-sep">★</span>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="gallery" id="gallery"></main>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <span class="arrow left" onclick="event.stopPropagation(); showPrev()">❮</span>
    <img id="lightbox-img" alt="Expanded artwork">
    <span class="arrow right" onclick="event.stopPropagation(); showNext()">❯</span>
</div>

<div id="sentinel"></div>

<script>
// LIGHTBOX
let currentLightboxIndex = 0;

function openLightbox(src) {
    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lightbox.style.display = "flex";

    const match = src.match(/(\d+)\.(jpg|webp)$/);
    if (match) currentLightboxIndex = parseInt(match[1]);
}

document.getElementById("lightbox-img").onclick = (e) => e.stopPropagation();

function showNext() {
    const nextSrc = `images/${currentLightboxIndex + 1}.webp`;

    const testImg = new Image();
    testImg.src = nextSrc;

    testImg.onload = () => {
        currentLightboxIndex++;
        document.getElementById("lightbox-img").src = nextSrc;
    };
}

function showPrev() {
    if (currentLightboxIndex > 1) {
        currentLightboxIndex--;
        document.getElementById("lightbox-img").src =
            `images/${currentLightboxIndex}.webp`;
    }
}

document.addEventListener("keydown", (e) => {
    const lightbox = document.getElementById("lightbox");
    if (lightbox.style.display === "flex") {
        if (e.key === "ArrowRight") showNext();
        if (e.key === "ArrowLeft") showPrev();
        if (e.key === "Escape") closeLightbox();
    }
});

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}


// GALLERY
const gallery = document.getElementById("gallery");
const sentinel = document.getElementById("sentinel");

const batchSize = 6;
let currentIndex = 1;
let isLoading = false;
let reachedEnd = false;


// MASONRY ENGINE (moved OUTSIDE)
const columnWidth = 320;
const gap = 12;

let columns = 0;
let columnHeights = [];

function setupMasonry() {
    const galleryWidth = gallery.clientWidth;

    columns = Math.floor(galleryWidth / (columnWidth + gap));
    if (columns < 1) columns = 1;

    columnHeights = new Array(columns).fill(0);
}

function placeImage(img) {
    // ensure height exists
    const height = offsetHeight;
    if (!height) return;

    let minCol = 0;
    for (let i = 1; i < columns; i++) {
        if (columnHeights[i] < columnHeights[minCol]) {
            minCol = i;
        }
    }

    const x = minCol * (columnWidth + gap);
    const y = columnHeights[minCol];

    img.style.left = x + "px";
    img.style.top = y + "px";

    columnHeights[minCol] += height + gap;

    gallery.style.height = Math.max(...columnHeights) + 200 + "px";
}


// LOAD IMAGES
function loadBatch() {
    if (isLoading || reachedEnd) return;
    isLoading = true;

    const batch = [];
    let loadedCount = 0;
    let attempted = 0;

    for (let i = 0; i < batchSize; i++) {
        const index = currentIndex;
        const src = `images/${index}.webp`;

        const img = new Image();
        img.src = src;

        attempted++;

        img.onload = () => {
            batch.push({ index, img });
            loadedCount++;
            checkDone();
        };

        img.onerror = () => {
            attempted--;
            checkDone();
        };

        currentIndex++;
    }

    function checkDone() {
        if (loadedCount === attempted || reachedEnd) {
            renderBatch();
        }
    }

    function renderBatch() {
        batch.sort((a, b) => a.index - b.index);

        batch.forEach(obj => {
            const img = obj.img;

            img.alt = `Illustration ${obj.index}`;
            img.loading = "lazy";
            img.onclick = () => openLightbox(img.src);
            img.style.width = columnWidth + "px";
            img.style.position = "absolute";

            gallery.appendChild(img);

            // wait for DOM paint → then place
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    placeImage(img);
                    img.classList.add("loaded");
                });
            });
        });

        isLoading = false;
    }
}


// INIT (IMPORTANT ORDER)
window.addEventListener("load", () => {
    setupMasonry();
    loadBatch();

    observer.observe(sentinel);
});


// SCROLL LOAD
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
            loadBatch();
        }
    });
}, {
    rootMargin: "300px"
});


// RESIZE
window.addEventListener("resize", () => {
    setupMasonry();

    const images = gallery.querySelectorAll("img");

    columnHeights.fill(0);

    images.forEach(img => {
        placeImage(img);
    });
});
</script>

</body>
</html>
