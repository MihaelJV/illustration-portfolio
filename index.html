<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav>
        <a href="index.html">Illustrations</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
    </nav>
    <div class="sub-header">
        <a href="index.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>
</header>

<main class="gallery">
    <!-- Replace with your images -->
    <img src="images/img1.jpg" onclick="openLightbox(this.src)">
    <img src="images/img2.jpg" onclick="openLightbox(this.src)">
    <img src="images/img3.jpg" onclick="openLightbox(this.src)">
    <img src="images/img4.jpg" onclick="openLightbox(this.src)">
</main>
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img">
    </div>
    <script>
        function openLightbox(src) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("lightbox-img").src = src;
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
</script>
</body>
</html>
